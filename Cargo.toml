[package]
name = "xiaohong-context-fabric"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Domain-agnostic versioned context snapshots and synchronization primitives"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1"
